name: Publish to NPM/GPR

on:
  release:
    types:
      - published

  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.JS with NPM registry
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # Authenticates via npm Trusted Publishing (OIDC) - no token secret.
      # Requires the trusted publisher to be configured on npmjs.com and
      # npm CLI >= 11.5.1, which node-version 'latest' provides.
      - name: Publish to NPM
        run: npm publish

      - name: Set up Node.JS with GPR registry
        uses: actions/setup-node@v4
        with:
          registry-url: "https://npm.pkg.github.com"
          scope: "@promet99"

      - name: Publish to GPR
        # GPR only accepts owner-scoped names; npm keeps the unscoped one.
        # Last step in the job, so no need to restore package.json.
        run: |
          npm pkg set name=@promet99/cz-emoji-conventional
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
